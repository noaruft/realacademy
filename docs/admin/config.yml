# 管理画面（Sveltia CMS）の設定。事業主さまが、ブログ・ニュース・イベント・生徒の声・実績データを入力欄で書く。
# 書いた内容は、非公開リポジトリ noaruft/realacademy-src の _src/ に JSON として保存される。
# 「保存」は下書き（GitHub のプルリクエスト）で、公開されない。「公開」を押すと main に入り、
# GitHub Actions がビルドして公開する（1〜2分）。仕組みと設定の手順は _src/README.md の「管理画面」。
# 設定の書き方：https://sveltiacms.app/en/docs

backend:
  name: github
  repo: noaruft/realacademy-src
  branch: main
  # 「GitHub でログイン」の中継（Sveltia CMS Authenticator・Cloudflare Workers）のアドレス。
  # 事業主さまの Cloudflare アカウントの Worker「sveltia-cms-auth」。設定は _src/README.md の「管理画面」
  base_url: https://sveltia-cms-auth.erina-haruki.workers.dev
  commit_messages:
    create: "管理画面：{{collection}}「{{slug}}」を追加"
    update: "管理画面：{{collection}}「{{slug}}」を更新"
    delete: "管理画面：{{collection}}「{{slug}}」を削除"
    uploadMedia: "管理画面：写真「{{path}}」を追加"
    deleteMedia: "管理画面：写真「{{path}}」を削除"

# 保存＝下書き、「公開」で公開（下書き → 公開できる、の2段階）
publish_mode:
  type: editorial_workflow
  stages: [draft, pending_publish]

app_title: REAL ACADEMY 管理画面
site_url: https://noaruft.github.io/realacademy/
show_preview_links: false
logo:
  src: https://noaruft.github.io/realacademy/assets/logo-sm.png

# 写真：入れたときに WebP に変えて長辺2400pxまでに縮め、assets/uploads/ に置く（「写真」フォルダは使わない）
media_folder: /assets/uploads
public_folder: /assets/uploads
media_libraries:
  default:
    config:
      max_file_size: 30000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

# 新しく作るときのファイル名（ページのアドレスになる）は半角英数字
slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------------------------------------------------------- ニュース（お知らせ）
  - name: news
    label: ニュース（お知らせ）
    label_singular: お知らせ
    description: お知らせ一覧とトップの「お知らせ」に、掲載日の新しい順に載ります。イベントの告知は「イベント」で作ってください（一覧に自動で載ります）。
    folder: _src/news
    format: json
    extension: json
    create: true
    identifier_field: title_ja
    slug:
      editable: [create]
      hint: ページのアドレス（news-○○.html）になります。半角の小文字英数字とハイフンで。例：toefl-2026。作ったあとは変えられません。
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "半角の小文字英数字とハイフン（-）で書いてください"]
    summary: "{{posted}}　{{title_ja}}"
    sortable_fields:
      fields: [posted, title_ja]
      default: { field: posted, direction: descending }
    media_folder: /assets/uploads/news
    public_folder: /assets/uploads/news
    fields:
      - { name: posted, label: 掲載日, widget: datetime, type: date }
      - { name: title_ja, label: タイトル（日本語）, widget: string, hint: お知らせ一覧に出るタイトル }
      - { name: title_en, label: タイトル（英語）, widget: string, required: false }
      - { name: heading_ja, label: 記事ページの見出し（日本語）, widget: string, required: false, hint: 一覧のタイトルと変えたいときだけ。空ならタイトルと同じ }
      - { name: heading_en, label: 記事ページの見出し（英語）, widget: string, required: false }
      - { name: lead_ja, label: 見出しの下の一文（日本語）, widget: string, required: false }
      - { name: lead_en, label: 見出しの下の一文（英語）, widget: string, required: false }
      - { name: body_ja, label: 本文（日本語）, widget: richtext, buttons: &buttons [bold, italic, link, heading-two, heading-three, bulleted-list, numbered-list, quote], editor_components: &components [image, table] }
      - { name: body_en, label: 本文（英語）, widget: richtext, required: false, buttons: *buttons, editor_components: *components, hint: 空のときは、英語表示で「日本語に切り替えてください」の案内が出ます }
      - { name: button_label_ja, label: 下のボタンの文字（日本語）, widget: string, required: false, hint: 関連ページへのボタンを置くときだけ（例：イギリス留学総合サポート） }
      - { name: button_label_en, label: 下のボタンの文字（英語）, widget: string, required: false }
      - { name: button_link, label: 下のボタンのリンク先, widget: string, required: false, hint: "例：uk-study.html（サイトのページ名）や https://… のアドレス" }
      - { name: desc, label: 検索・共有で表示する紹介文, widget: text, required: false, hint: 空なら「見出しの下の一文」かタイトルを使います }
      - { name: page_title_en, widget: hidden }

  # ---------------------------------------------------------------- イベント
  - name: events
    label: イベント
    label_singular: イベント
    description: イベントのページ・お知らせ一覧・トップ・お問い合わせフォームの「イベント参加申込」が自動で作られます。終了日を過ぎると自動で「開催終了」になります。
    folder: _src/events
    format: json
    extension: json
    create: true
    identifier_field: title
    slug:
      editable: [create]
      hint: ページのアドレス（event-○○.html）になります。半角の小文字英数字とハイフンで。例：christmas-2026。作ったあとは変えられません。
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "半角の小文字英数字とハイフン（-）で書いてください"]
    summary: "{{start}}　{{title}}"
    sortable_fields:
      fields: [start, posted, title]
      default: { field: start, direction: descending }
    media_folder: /assets/uploads/events
    public_folder: /assets/uploads/events
    fields:
      - { name: title, label: タイトル, widget: string, hint: "例：CHRISTMAS EVENT 2026 🎄" }
      - { name: title_en, label: タイトル（英語表示のとき）, widget: string, required: false, hint: 空ならタイトルと同じ }
      - { name: sub, label: サブタイトル, widget: string, required: false }
      - { name: posted, label: お知らせ一覧への掲載日, widget: datetime, type: date, required: false, hint: 空のときは、お知らせ一覧・トップには出ません（イベント一覧には出ます） }
      - { name: start, label: 開催日（複数日なら初日）, widget: datetime, type: date }
      - { name: end, label: 最終日, widget: datetime, type: date, required: false, hint: 1日だけなら空でかまいません。この日を過ぎると自動で「開催終了」になります }
      - name: status
        label: 受付の状態
        widget: select
        default: auto
        options:
          - { label: 自動（受付中。最終日を過ぎたら開催終了）, value: auto }
          - { label: 満席, value: full }
          - { label: 受付終了（手動で締め切る）, value: closed }
          - { label: 常に受付中, value: open }
      - { name: date_ja, label: 日程の表示（日本語）, widget: string, hint: "例：2026年12月23日（水）" }
      - { name: date_en, label: 日程の表示（英語）, widget: string, required: false, hint: "例：Wed 23 Dec 2026" }
      - { name: time_ja, label: 時間（日本語）, widget: text, required: false, hint: "例：16:00〜18:30。改行するとそのまま改行されます" }
      - { name: time_en, label: 時間（英語）, widget: text, required: false }
      - { name: place_ja, label: 場所（日本語）, widget: string, default: STEAM English Academy 麻布校 }
      - { name: place_en, label: 場所（英語）, widget: string, required: false, default: STEAM English Academy Azabu }
      - name: spec
        label: そのほかの項目（対象・定員・参加費・持ち物など）
        label_singular: 項目
        widget: list
        required: false
        summary: "{{fields.label_ja}}：{{fields.value_ja}}"
        fields:
          - { name: label_ja, label: 項目名（日本語）, widget: string, hint: "例：参加費" }
          - { name: label_en, label: 項目名（英語）, widget: string, required: false, hint: "例：Fee" }
          - { name: value_ja, label: 内容（日本語）, widget: string }
          - { name: value_en, label: 内容（英語）, widget: string, required: false }
      - { name: photo, label: 写真（チラシなど）, widget: image, required: false, hint: パソコンでは左、スマホでは上に、写真の縦横の比率のまま載ります }
      # イベントの写真は上の「写真（チラシなど）」の1枚だけなので、本文には写真のボタンを出さない（表だけ）
      - { name: body_ja, label: 本文（日本語）, widget: richtext, required: false, buttons: *buttons, editor_components: [table] }
      - { name: body_en, label: 本文（英語）, widget: richtext, required: false, buttons: *buttons, editor_components: [table], hint: 空のときは、英語表示で「日本語に切り替えてください」の案内が出ます }
      - name: form
        label: 申込フォームの項目（受付中のあいだ、お問い合わせフォームに出ます）
        label_singular: 申込の項目
        widget: list
        required: false
        summary: "{{fields.label_ja}}"
        fields:
          - name: type
            label: 種類
            widget: select
            default: radio
            options:
              - { label: 1つだけ選ぶ（必須）, value: radio }
              - { label: いくつでも選べる, value: checkbox }
              - { label: 1行の入力欄, value: text }
              - { label: 複数行の入力欄, value: textarea }
          - { name: label_ja, label: 項目名（日本語）, widget: string, hint: "例：参加希望時間" }
          - { name: label_en, label: 項目名（英語）, widget: string, required: false, hint: "例：Session" }
          - name: options
            label: 選択肢（「1つだけ選ぶ」「いくつでも選べる」のとき）
            label_singular: 選択肢
            widget: list
            required: false
            summary: "{{fields.ja}}"
            fields:
              - { name: ja, label: 日本語, widget: string }
              - { name: en, label: 英語, widget: string, required: false }
              - { name: full, label: 満席（選べなくする）, widget: boolean, default: false }
      - { name: photo_no, widget: hidden }

  # ---------------------------------------------------------------- ブログ
  - name: blog
    label: ブログ
    label_singular: ブログ記事
    description: ブログ一覧（カテゴリの絞り込み付き）とトップに、日付の新しい順に載ります。
    folder: _src/blog
    format: json
    extension: json
    create: true
    identifier_field: title
    slug:
      editable: [create]
      hint: ページのアドレス（blog-○○.html）になります。半角の小文字英数字とハイフンで。例：summer-2026。作ったあとは変えられません。
      pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "半角の小文字英数字とハイフン（-）で書いてください"]
    summary: "{{date}}　{{title}}"
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    media_folder: /assets/uploads/blog
    public_folder: /assets/uploads/blog
    fields:
      - { name: title, label: タイトル（日本語）, widget: string }
      - { name: title_en, label: タイトル（英語）, widget: string, required: false }
      - { name: date, label: 日付, widget: datetime, type: date }
      - name: category
        label: カテゴリ
        widget: select
        default: english
        options:
          - { label: 英語関連, value: english }
          - { label: 留学関連, value: overseas }
          - { label: 教育関連, value: education }
          - { label: 世界情勢, value: world }
          - { label: その他, value: other }
      - { name: summary, label: 一覧に出る短い紹介文, widget: text, required: false }
      - { name: body_ja, label: 本文（日本語）, widget: richtext, buttons: *buttons, editor_components: *components }
      - { name: body_en, label: 本文（英語）, widget: richtext, required: false, buttons: *buttons, editor_components: *components }
      - { name: draft, label: 公開しない（チェックすると一覧にもページにも出ません）, widget: boolean, default: false, required: false }

  # ---------------------------------------------------------------- 生徒の声
  - name: voices
    label: 生徒の声
    label_singular: 生徒の声
    description: 「保護者・生徒の声」は、ページごとに別々の一覧です。並べた順に表示されます（ドラッグで並べ替えられます）。
    media_folder: /assets/uploads/voices
    public_folder: /assets/uploads/voices
    files:
      - { name: top, label: トップページ, file: _src/data/voices-top.json, format: json, fields: &voice_fields [{ name: voices, label: 保護者・生徒の声, label_singular: 声, widget: list, summary: "{{fields.name_ja}}", fields: [{ name: name_ja, label: お名前（日本語）, widget: string, hint: "例：小学6年生 Rくんの保護者さま（2025年3月）" }, { name: name_en, label: お名前（英語）, widget: string, required: false, hint: "例：Parent of R, Grade 6 (March 2025)" }, { name: highlight_ja, label: 大きく出る一言（日本語）, widget: string, required: false }, { name: highlight_en, label: 大きく出る一言（英語）, widget: string, required: false }, { name: text_ja, label: 本文（日本語）, widget: text }, { name: text_en, label: 本文（英語）, widget: text, required: false }, { name: photo, label: 写真（丸く切り抜かれます）, widget: image, required: false, hint: 正方形の写真がおすすめです。空のときは、これまでの写真（または空の丸い枠）が出ます }, { name: photo_no, widget: hidden }] }] }
      - { name: school, label: 英語教室, file: _src/data/voices-school.json, format: json, fields: *voice_fields }
      - { name: uk, label: イギリス留学, file: _src/data/voices-uk.json, format: json, fields: *voice_fields }

  # ---------------------------------------------------------------- 実績データ
  - name: results
    label: 実績データ
    label_singular: 実績データ
    description: イギリス留学のページの「実績・データ」です。
    files:
      - name: results
        label: 実績・データ
        file: _src/data/results.json
        format: json
        fields:
          - { name: as_of_ja, label: 見出しの下の一文（日本語）, widget: string, required: false, hint: "例：2024年末時点の実績（在校歴2年以上の生徒さま）" }
          - { name: as_of_en, label: 見出しの下の一文（英語）, widget: string, required: false }
          - name: items
            label: 実績
            label_singular: 実績
            widget: list
            summary: "{{fields.grade_ja}}　{{fields.text_ja}}"
            fields:
              - { name: grade_ja, label: 学年（日本語）, widget: string, hint: "例：小学6年生" }
              - { name: grade_en, label: 学年（英語）, widget: string, required: false, hint: "例：Grade 6" }
              - { name: text_ja, label: 実績（日本語）, widget: string }
              - { name: text_en, label: 実績（英語）, widget: string, required: false }
              - { name: note_ja, label: 補足（日本語・小さい字）, widget: string, required: false }
              - { name: note_en, label: 補足（英語）, widget: string, required: false }
          - { name: footer_ja, label: 下の一文（日本語）, widget: text, required: false }
          - { name: footer_en, label: 下の一文（英語）, widget: text, required: false }
